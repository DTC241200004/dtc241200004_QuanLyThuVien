server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Thu thập Log truy cập và lỗi từ Nginx Reverse Proxy
  - job_name: nginx_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: nginx-reverse-proxy
          student_id: dtc241200004
          __path__: /var/log/nginx/*.log

  # 2. Thu thập Log nghiệp vụ (Mượn/Trả sách, Độc giả, Sách) từ Ứng dụng PHP
  - job_name: library_app_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: library_app
          service: library-web-app
          student_id: dtc241200004
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            action: action
            message: message
      - labels:
          level:
          action:

  # 3. Thu thập Log của toàn bộ Docker Containers trên hệ thống
  - job_name: docker_containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker_containers
          student_id: dtc241200004
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}

