services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: dtc241200004_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Công cụ quản trị CSDL pgAdmin 4
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: dtc241200004_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net

  # 3. Ứng dụng Web Quản lý Thư viện (PHP-FPM)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: dtc241200004_app
    restart: unless-stopped
    environment:
      STUDENT_ID: ${STUDENT_ID}
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./app:/var/www/html:ro
      - app_logs:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  # 4. Nginx Reverse Proxy (HTTPS tự ký + Security Headers)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: dtc241200004_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:8080"
      - "${NGINX_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./app:/var/www/html:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - frontend_net
      - monitoring_net

  # 5. Nginx Prometheus Exporter (Giám sát Web Server)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: dtc241200004_nginx_exporter
    restart: unless-stopped
    command:
      - "-nginx.scrape-uri=http://nginx:8081/stub_status"
    depends_on:
      - nginx
    networks:
      - monitoring_net

  # 6. Postgres Prometheus Exporter (Giám sát Database)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: dtc241200004_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net
      - monitoring_net

  # 7. cAdvisor (Giám sát tài nguyên Docker Containers)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: dtc241200004_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_net

  # 8. Prometheus (Thu thập và lưu trữ Metrics)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: dtc241200004_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - nginx-exporter
      - postgres-exporter
      - cadvisor
    networks:
      - monitoring_net

  # 9. Grafana (Trực quan hóa Metrics & Logs)
  grafana:
    image: grafana/grafana:10.4.2
    container_name: dtc241200004_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./prometheus/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    networks:
      - monitoring_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: false
  monitoring_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  app_logs:
  nginx_logs:
  prometheus_data:
  grafana_data:
