services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: dtc241200004_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Công cụ quản trị CSDL pgAdmin 4
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: dtc241200004_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net

  # 3. Ứng dụng Web Quản lý Thư viện (PHP-FPM)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: dtc241200004_app
    restart: unless-stopped
    environment:
      STUDENT_ID: ${STUDENT_ID}
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./app:/var/www/html:ro
      - app_logs:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  # 4. Nginx Reverse Proxy (HTTPS tự ký + Security Headers)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: dtc241200004_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:8080"
      - "${NGINX_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./app:/var/www/html:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - frontend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  pgadmin_data:
  app_logs:
  nginx_logs:
