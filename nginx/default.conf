# ==============================================================================
# CẤU HÌNH NGINX REVERSE PROXY & HARDENING SECURITY HEADERS
# Hệ thống Quản lý Thư viện - Sinh viên: DTC241200004
# ==============================================================================

# Hardening: Ẩn phiên bản Nginx trên Header và trang lỗi
server_tokens off;

# Định dạng log chi tiết phục vụ Promtail + Loki
log_format library_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

# 1. HTTP Server (Port 8080)
server {
    listen 8080;
    server_name localhost dtc241200004.local;

    root /var/www/html;
    index index.php index.html;

    access_log /var/log/nginx/access.log library_combined;
    error_log  /var/log/nginx/error.log warn;

    # Hardening: HTTP Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:;" always;

    # Giới hạn kích thước request body chống tấn công DoS
    client_max_body_size 10M;

    # Chặn truy cập các file ẩn (.env, .git, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Chuyển tiếp (Reverse Proxy / FastCGI) các request PHP sang container app
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }
}

# 2. HTTPS Server với chứng chỉ SSL tự ký (Port 8443)
server {
    listen 8443 ssl;
    server_name localhost dtc241200004.local;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/html;
    index index.php index.html;

    access_log /var/log/nginx/access.log library_combined;
    error_log  /var/log/nginx/error.log warn;

    # Hardening: HTTP Security Headers + HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:;" always;

    client_max_body_size 10M;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }
}

# 3. Internal Metrics Endpoint cho Prometheus Nginx Exporter (Port 8081)
server {
    listen 8081;
    server_name localhost;

    access_log off;

    location /stub_status {
        stub_status on;
    }
}

